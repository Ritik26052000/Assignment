# Non-secret defaults only. Secrets (DB password, JWT secret) come from environment variables.
spring:
  application:
    name: taskflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

taskflow:
  jwt:
    # Required, UTF-8 string of at least 32 bytes (256 bits). The app refuses to start without it.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  swagger:
    enabled: ${SWAGGER_ENABLED:false}
  seed:
    demo-data: ${SEED_DEMO_DATA:false}

springdoc:
  api-docs:
    enabled: ${taskflow.swagger.enabled}
  swagger-ui:
    enabled: ${taskflow.swagger.enabled}
    path: /swagger-ui.html
